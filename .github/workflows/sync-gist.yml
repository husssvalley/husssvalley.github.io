name: sync
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch and write
        env:
          PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: 6bb037f859d2dc4f26f8c0e4880aa9a2
        run: python3 .github/scripts/sync.py

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "."
            git push
          fi
